[pipeline]
# SZp / fZ-light — the SUPPORTED expression of the SZp algorithm.
#   Quantizer(linear) → Lorenzo(block_size=128) → AdaptiveBitpack(block_size=128)
#
# SZp's inner loop is 1-D Lorenzo prediction + error-bound quantization +
# per-block fixed-length residual packing, with NO entropy coder. That is exactly
# this three-stage chain — the same structure as cuszp.toml, but at SZp's default
# block size of 128. This preset reproduces SZp *behavior* (an error-bounded,
# entropy-coder-free, fixed-length-packed archive) with ZERO new code, and the
# automatic-fusion planner fuses the whole chain into one warp-register kernel.
#
# It is NOT byte-compatible with the reference SZp container (compressors/SZp).
# The monolithic `SZpStage` reference implementation is quarantined under
# experimental/reference_compressors/szp/ (and its legacy preset at
# experimental/reference_compressors/szp/szp.toml); it is a GPU point of
# comparison only, not a supported module. Use THIS preset for the SZp algorithm.
#
# SZp / fZ-light: Huang, Di, et al., SC'24. hZCCL adds compressed-domain
# collectives on top of this container (not expressible as a preset).
#
# Usage:
#   fzgmod-cli -c examples/presets/szp_composed.toml \
#              -i data/CLDHGH.f32 -l 3600x1800 -b --report --compare data/CLDHGH.f32
memory_strategy = "PREALLOCATE"

[[stage]]
name = "quant"
type = "Quantizer"
input_type = "float32"
code_type = "uint32"
error_bound = 1e-3
error_bound_mode = "ABS"
linear_mode = true

[[stage]]
name = "lrz"
type = "Lorenzo"
data_type = "int32"
block_size = 128
inputs = [{from = "quant", port = "codes"}]

[[stage]]
name = "ab"
type = "AdaptiveBitpack"
input_type = "int32"
block_size = 128
inputs = [{from = "lrz"}]
