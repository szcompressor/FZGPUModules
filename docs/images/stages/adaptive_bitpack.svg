<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Plain-mode adaptive bitpack encoding of one eight-element block</title>
  <desc id="desc">In plain mode, a signed integer block is separated into a sign bitmap and magnitude bit-planes. The largest magnitude determines the number of stored planes, and the rate byte, bitmap, and planes form the serialized payload. Outlier-selection mode is not shown.</desc>
  <defs>
    <style>
      .heading { font: 700 22px sans-serif; fill: #172033; }
      .label { font: 600 16px sans-serif; fill: #172033; }
      .small { font: 14px sans-serif; fill: #344054; }
      .mono { font: 15px monospace; fill: #172033; }
      .cell { fill: #f7f9fc; stroke: #667085; stroke-width: 1.5; }
      .meta { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .sign { fill: #ffedd5; stroke: #ea580c; stroke-width: 1.5; }
      .plane { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .muted { fill: #f2f4f7; stroke: #98a2b3; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #475467; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475467"/>
    </marker>
  </defs>

  <rect width="1040" height="560" rx="14" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="40" y="45" class="heading">Plain mode: one adaptive fixed-rate block</text>

  <text x="40" y="92" class="label">1. Signed values</text>
  <g transform="translate(40 110)">
    <rect class="cell" x="0" y="0" width="72" height="48"/><text class="mono" x="36" y="30" text-anchor="middle">0</text>
    <rect class="cell" x="72" y="0" width="72" height="48"/><text class="mono" x="108" y="30" text-anchor="middle">-3</text>
    <rect class="cell" x="144" y="0" width="72" height="48"/><text class="mono" x="180" y="30" text-anchor="middle">2</text>
    <rect class="cell" x="216" y="0" width="72" height="48"/><text class="mono" x="252" y="30" text-anchor="middle">1</text>
    <rect class="cell" x="288" y="0" width="72" height="48"/><text class="mono" x="324" y="30" text-anchor="middle">-1</text>
    <rect class="cell" x="360" y="0" width="72" height="48"/><text class="mono" x="396" y="30" text-anchor="middle">0</text>
    <rect class="cell" x="432" y="0" width="72" height="48"/><text class="mono" x="468" y="30" text-anchor="middle">3</text>
    <rect class="cell" x="504" y="0" width="72" height="48"/><text class="mono" x="540" y="30" text-anchor="middle">-2</text>
    <text class="small" x="288" y="72" text-anchor="middle">element index 0 ... 7</text>
  </g>
  <path class="arrow" d="M328 190 L328 220"/>

  <text x="40" y="245" class="label">2. Split sign from magnitude</text>
  <text x="40" y="278" class="small">sign</text>
  <g transform="translate(112 253)">
    <rect class="sign" x="0" y="0" width="52" height="38"/><text class="mono" x="26" y="25" text-anchor="middle">0</text>
    <rect class="sign" x="52" y="0" width="52" height="38"/><text class="mono" x="78" y="25" text-anchor="middle">1</text>
    <rect class="sign" x="104" y="0" width="52" height="38"/><text class="mono" x="130" y="25" text-anchor="middle">0</text>
    <rect class="sign" x="156" y="0" width="52" height="38"/><text class="mono" x="182" y="25" text-anchor="middle">0</text>
    <rect class="sign" x="208" y="0" width="52" height="38"/><text class="mono" x="234" y="25" text-anchor="middle">1</text>
    <rect class="sign" x="260" y="0" width="52" height="38"/><text class="mono" x="286" y="25" text-anchor="middle">0</text>
    <rect class="sign" x="312" y="0" width="52" height="38"/><text class="mono" x="338" y="25" text-anchor="middle">0</text>
    <rect class="sign" x="364" y="0" width="52" height="38"/><text class="mono" x="390" y="25" text-anchor="middle">1</text>
  </g>
  <text x="40" y="328" class="small">|value|</text>
  <g transform="translate(112 303)">
    <rect class="cell" x="0" y="0" width="52" height="38"/><text class="mono" x="26" y="25" text-anchor="middle">00</text>
    <rect class="cell" x="52" y="0" width="52" height="38"/><text class="mono" x="78" y="25" text-anchor="middle">11</text>
    <rect class="cell" x="104" y="0" width="52" height="38"/><text class="mono" x="130" y="25" text-anchor="middle">10</text>
    <rect class="cell" x="156" y="0" width="52" height="38"/><text class="mono" x="182" y="25" text-anchor="middle">01</text>
    <rect class="cell" x="208" y="0" width="52" height="38"/><text class="mono" x="234" y="25" text-anchor="middle">01</text>
    <rect class="cell" x="260" y="0" width="52" height="38"/><text class="mono" x="286" y="25" text-anchor="middle">00</text>
    <rect class="cell" x="312" y="0" width="52" height="38"/><text class="mono" x="338" y="25" text-anchor="middle">11</text>
    <rect class="cell" x="364" y="0" width="52" height="38"/><text class="mono" x="390" y="25" text-anchor="middle">10</text>
  </g>
  <rect class="meta" x="610" y="253" width="176" height="88" rx="8"/>
  <text x="698" y="281" class="small" text-anchor="middle">max |value| = 3</text>
  <text x="698" y="316" class="label" text-anchor="middle">rate r = 2 bits</text>
  <path class="arrow" d="M800 297 L845 297"/>
  <text x="864" y="280" class="small">store only</text>
  <text x="864" y="302" class="small">planes 0 and 1</text>

  <path class="arrow" d="M328 363 L328 392"/>
  <text x="40" y="420" class="label">3. Transpose magnitude bits and serialize</text>
  <g transform="translate(40 442)">
    <rect class="meta" x="0" y="0" width="128" height="58" rx="5"/>
    <text class="label" x="64" y="25" text-anchor="middle">rate</text><text class="mono" x="64" y="47" text-anchor="middle">2</text>
    <rect class="sign" x="178" y="0" width="202" height="58" rx="5"/>
    <text class="label" x="279" y="24" text-anchor="middle">sign bitmap</text><text class="mono" x="279" y="47" text-anchor="middle">01001001</text>
    <rect class="plane" x="430" y="0" width="202" height="58" rx="5"/>
    <text class="label" x="531" y="24" text-anchor="middle">plane 0</text><text class="mono" x="531" y="47" text-anchor="middle">01011010</text>
    <rect class="plane" x="682" y="0" width="202" height="58" rx="5"/>
    <text class="label" x="783" y="24" text-anchor="middle">plane 1</text><text class="mono" x="783" y="47" text-anchor="middle">01100011</text>
    <path class="arrow" d="M132 29 L170 29"/><path class="arrow" d="M384 29 L422 29"/><path class="arrow" d="M636 29 L674 29"/>
  </g>
  <text x="40" y="535" class="small">Each additional block repeats this decision; an exclusive scan concatenates the variable-size block payloads.</text>
</svg>
