[pipeline]
# SZp / fZ-light-inspired modular composition.
#   Quantizer(linear) → Lorenzo(block_size=128) → AdaptiveBitpack(block_size=128)
#
# This matches the published high-level structure: scalar quantization, 1-D
# Lorenzo differences, sign bits, and per-block fixed-width packing, with no
# entropy coder. It is not an exact upstream reconstruction: the CPU SZp code
# truncates x/eb, stores one seed per OpenMP partition, and carries prediction
# across its small-block boundaries. FZGM uses its generic round(x/(2eb))
# quantizer and resets Lorenzo at each 128-value block. Treat this as a related
# GPU composition whose staged/auto performance isolates FZGM specialization.
#
# It is NOT byte-compatible with the reference SZp container. The monolithic
# The monolithic reference implementation is available on the development branch.

[[stage]]
name = "quant"
type = "Quantizer"
input_type = "float32"
code_type = "uint32"
error_bound = 1e-3
error_bound_mode = "ABS"
linear_mode = true

[[stage]]
name = "lrz"
type = "Lorenzo"
data_type = "int32"
block_size = 128
inputs = [{from = "quant", port = "codes"}]

[[stage]]
name = "ab"
type = "AdaptiveBitpack"
input_type = "int32"
block_size = 128
inputs = [{from = "lrz"}]
