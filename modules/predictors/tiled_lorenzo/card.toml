# Module card — pilot (schema: memory/module_cards.md §3, facet vocab v0.2 §2)
# Fields under [identity] and [facets.contract] are validated against the live
# Stage interface by the contract-validation test (§4). Do not hand-edit those
# to disagree with the code — the test will fail.

[identity]
name          = "TiledLorenzoStage"
get_name      = "TiledLorenzo"     # == Stage::getName()
stage_type_id = 25                 # == StageType::TILED_LORENZO
category      = "predictor"        # modules/ directory
templated     = true               # TiledLorenzoStage<int16_t|int32_t>
version_added = "1.0"

[facets]
lossiness = "lossless"             # integer separable delta; exact round-trip
role      = ["decorrelation"]
algorithm = ["tiled-lorenzo"]
data      = ["2d", "3d", "signed-int", "structured-grid", "spatial"]
hardware  = ["cuda", "sm70+", "memory-bound"]
contract  = ["graph-capturable", "dimension-aware"]   # forward/compress path (capture is forward-only); no D2H, deterministic sizes
pipeline  = ["cuszp3"]
maturity  = "stable"

[facets.notes]
# 1-D is intentionally out of scope here — covered by LorenzoStage::setBlockSize.
# Single output port "output"; tile-major + zero-padded so downstream
# AdaptiveBitpack(block_size = tile_elems) packs one block per tile.

[zhub]
implements    = ["lorenzo-predictor"]   # GPU impl of the Z-Hub algorithm entry
zhub_category = "Predictor"             # F1 role -> Z-Hub category enum

[provenance]
algorithm_origin = "cuSZp3 / VGC (SC'25) dimension-aware tiled separable delta"
upstream         = "cuSZp3"
license          = "BSD-3-Clause"        # copyright reproduced verbatim in THIRD_PARTY.md
provenance       = "vendored"            # DIRECT PORT of cuSZp3 delta kernel logic (cuSZp_kernels_{2D,3D}_f32.cu)

[[papers]]
title   = "GPU Lossy Compression for HPC Can Be Versatile and Ultra-Fast"
authors = "Yafan Huang, Sheng Di, Guanpeng Li, Franck Cappello"
venue   = "SC '25"
year    = 2025
pages   = "2056-2075"
doi     = "10.1145/3712285.3759817"
note    = "cuSZp3 / VGC — source of the dimension-aware tiled separable delta"

[evaluation]                            # reproducible via --report-json
metrics  = { cr = "3.95x", ref_cr = "3.9466x" }   # plain mode, validated vs reference cuSZp3
datasets = []                           # TODO: name the validation dataset(s)

[settings]
# Tunable knobs surfaced to users / TOML config.
tile_shape   = { setter = "setTileShape(tx,ty,tz)", default = "2-D 8x8 / 3-D 4x4x4 / 1-D 64", constraint = "each extent 1..255, product 1..1024" }
element_type = { template = "T", values = ["int16", "int32"] }
# TOML keys: type="TiledLorenzo", data_type, tile_x/tile_y/tile_z (dims from setDims).

[summary]
one_liner = "cuSZp3 dimension-aware tiled separable integer delta predictor (2D/3D), lossless."
features  = [
  "2D/3D separable integer Lorenzo within fixed tiles",
  "Tile-major, zero-padded output feeds AdaptiveBitpack one block per tile (cuSZp3 layout)",
  "Forward (compress) path is CUDA-graph capturable (deterministic sizes, no D2H); capture is forward-only",
  "Inverse un-tiles back to natural row-major order",
]

[docs]
page       = "docs/stages/tiled_lorenzo.md"
design     = "memory/cuszp_stages.md"   # Part 8
attribution = "THIRD_PARTY.md#cuszp--cuszp2--cuszp3"
