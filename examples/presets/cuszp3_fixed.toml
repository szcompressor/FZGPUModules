[pipeline]
# cuSZp3 (fixed) — Quantizer(linear) → AdaptiveBitpack
#
#   Quantizer        linear_mode: q = round(x/2eb), signed codes
#   AdaptiveBitpack  block_size=64: per-block rate byte + sign bitmap + bit-planes
#
# No delta (no predictor): integer quantization + fixed-length encoding only.
# Best on unsmooth/unstructured data or ML weights. For smooth data use
# cuszp3.toml (plain) or cuszp3_outlier.toml. cuSZp3: Huang et al., SC'25.
#
# Usage:
#   fzgmod-cli -c examples/presets/cuszp3_fixed.toml \
#              -i data/CLDHGH.f32 -l 3600x1800 -b --report --compare data/CLDHGH.f32
memory_strategy = "PREALLOCATE"

[[stage]]
name = "quant"
type = "Quantizer"
input_type = "float32"
code_type = "uint32"
error_bound = 1e-3
error_bound_mode = "ABS"
linear_mode = true

[[stage]]
name = "ab"
type = "AdaptiveBitpack"
input_type = "int32"
block_size = 64
inputs = [{from = "quant", port = "codes"}]
