[pipeline]
# cuSZp (plain) — Quantizer(linear) → Lorenzo(block) → AdaptiveBitpack
#
#   Quantizer        linear_mode: q = round(x/2eb), signed codes, no outliers
#   Lorenzo          block_size=32: 1-D delta, resets every 32 elements
#   AdaptiveBitpack  block_size=32: per-block rate byte + sign bitmap + bit-planes
#
# block_size matches between Lorenzo and AdaptiveBitpack (both 32). Best on sparse
# data; for non-sparse data use cuszp2.toml. cuSZp: Huang et al., SC'23.
#
# Usage:
#   fzgmod-cli -c examples/presets/cuszp.toml \
#              -i data/CLDHGH.f32 -l 3600x1800 -b --report --compare data/CLDHGH.f32
memory_strategy = "PREALLOCATE"

[[stage]]
name = "quant"
type = "Quantizer"
input_type = "float32"
code_type = "uint32"
error_bound = 1e-3
error_bound_mode = "ABS"
linear_mode = true

[[stage]]
name = "lrz"
type = "Lorenzo"
data_type = "int32"
block_size = 32
inputs = [{from = "quant", port = "codes"}]

[[stage]]
name = "ab"
type = "AdaptiveBitpack"
input_type = "int32"
block_size = 32
inputs = [{from = "lrz"}]
