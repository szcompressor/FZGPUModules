[pipeline]
# cuSZp3 (outlier, 2-D) — cuszp3.toml plus per-block outlier selection
#
# Same pipeline as cuszp3.toml (Quantizer(linear) → TiledLorenzo(8x8) →
# AdaptiveBitpack), with AdaptiveBitpack outlier_selection = true: each tile may
# instead store its origin element as a raw 1..4-byte outlier and pack the rest.
# Best on non-sparse, globally-smooth data. cuSZp3: Huang et al., SC'25.
#
# Usage:
#   fzgmod-cli -c examples/presets/cuszp3_outlier.toml \
#              -i data/CLDHGH.f32 -l 3600x1800 -b --report --compare data/CLDHGH.f32
memory_strategy = "PREALLOCATE"

[[stage]]
name = "quant"
type = "Quantizer"
input_type = "float32"
code_type = "uint32"
error_bound = 1e-3
error_bound_mode = "ABS"
linear_mode = true

[[stage]]
name = "tl"
type = "TiledLorenzo"
data_type = "int32"
tile_x = 8
tile_y = 8
tile_z = 1
inputs = [{from = "quant", port = "codes"}]

[[stage]]
name = "ab"
type = "AdaptiveBitpack"
input_type = "int32"
block_size = 64
outlier_selection = true
inputs = [{from = "tl"}]
