# Module card — pilot (schema: memory/module_cards.md §3, facet vocab v0.2 §2)
# Fields under [identity] and [facets.contract] are validated against the live
# Stage interface by the contract-validation test (§4).

[identity]
name          = "GInterpStage"
get_name      = "GInterp"          # == Stage::getName()
stage_type_id = 22                 # == StageType::G_INTERP
category      = "fused"            # modules/fused/ginterp
templated     = true               # GInterpStage<{float,double}, {uint8,uint16,uint32}> — 6 instantiations
version_added = "1.0"

[facets]
lossiness = "lossy"                # error-bounded; see [caveats] — bound is a TARGET, not a hard guarantee
role      = ["fused", "decorrelation", "quantization"]
algorithm = ["interpolation-spline"]
data      = ["2d", "3d", "float32", "float64", "smooth-field", "spatial"]
hardware  = ["cuda", "sm70+"]     # 3-D double needs Volta+ (opt-in dynamic shared mem >= ~77 KB)
contract  = ["multi-output", "dimension-aware"]   # NOT graph-capturable — see [caveats]
pipeline  = ["cusz-hi"]
maturity  = "beta"                 # 2-D auto-tune + several auto-tune modes still landing

[facets.notes]
# 4 output ports: "codes" (connect coders here), "anchor", "outlier_vals", "outlier_idxs".
# Outlier COUNT is not a port — stage-private scratch, serialized in FZM header.
# 1-D is rejected (cuSZ-Hi has no 1-D path); setDims(nx,ny,1) picks the 2-D launcher.

[zhub]
implements    = ["interpolation"]  # Z-Hub "interpolation" (spline / b-spline) algorithm entry
zhub_category = "Predictor"        # Z-Hub has no "fused" category; maps up to its dominant role

[provenance]
algorithm_origin = "cuSZ-Hi multi-level spline interpolation predictor + quantizer"
upstream         = "cuSZ-Hi"
license          = "BSD-3-Clause"
provenance       = "vendored"      # kernels adapted from spline3.cu/spline3_md.inl; bug-fix patched locally (THIRD_PARTY.md)

[[papers]]
title   = "Boosting Scientific Error-Bounded Lossy Compression through Optimized Synergistic Lossy-Lossless Orchestration"
authors = "Shixun Wu, Jinwen Pan, Jinyang Liu, Jiannan Tian, Ziwei Qiu, Jiajun Huang, Kai Zhao, Xin Liang, Sheng Di, Zizhong Chen, Franck Cappello"
venue   = "SC '25"
year    = 2025
pages   = "2024-2037"
doi     = "10.1145/3712285.3759798"
url     = "https://github.com/shixun404/cuSZ-Hi"
note    = "cuSZ-Hi — source of the multi-level spline interpolation kernels"

[evaluation]                       # reproducible via --report-json
metrics  = {}                      # TODO: representative CR / throughput / observed error vs eb
datasets = []

[settings]
error_bound      = { setter = "setErrorBound(eb)" }
error_bound_mode = { setter = "setErrorBoundMode(ABS|REL|NOA)" }
quant_radius     = { setter = "setQuantRadius(n)", default = "0 = auto-tune scan", note = "set >0 for manual/graph" }
outlier_capacity = { setter = "setOutlierCapacity(frac)", default = "0.10" }
auto_tuning      = { setter = "setAutoTuning(0|1|3)", default = "0 = off", note = "3-D only; nonzero => host D2H sync" }
# TOML keys: type="GInterp", input_type, code_type, error_bound, error_bound_mode,
# quant_radius (0=auto), outlier_capacity, optional auto_tuning.

[caveats]
graph_capture = "Not graph-capturable: auto-tune radius scan and outlier-count D2H both sync the host. setQuantRadius(>0)+setAutoTuning(0) removes the scans but the outlier D2H remains."
error_bound   = "Error bound is a TARGET, not a hard guarantee — multi-level interpolation accumulates error: typically <= 1.1*eb, up to ~2*eb on outlier-heavy data."
dim_support   = "2-D supported but uses a 3-D-like tile (AnchorBlockSize 16x16x1); auto-tune modes 1/3 are 3-D only and fall back to baseline in 2-D."

[summary]
one_liner = "cuSZ-Hi multi-level spline interpolation predictor + error-bounded quantizer (2D/3D), lossy."
features  = [
  "Multi-level spline (interpolation) decorrelation fused with error-bounded quantization",
  "2-D and 3-D inputs (1-D rejected)",
  "Optional INTERPOLATION_PARAMS auto-tuning (3-D)",
  "Radius auto-tune by default; set explicitly for deterministic/graph use",
]

[docs]
page        = "docs/stages/ginterp.md"
attribution = "THIRD_PARTY.md#cusz-hi"
